<svg width="680" height="240" viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Mesh to graph conversion</title>
<desc>A small triangulated mesh patch on the left becomes a graph of nodes and edges on the right -- each vertex is a node, each triangle edge becomes a graph edge.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5b5b58" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="140" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">mesh</text>

<polygon points="80,110 140,110 140,170" fill="#EFEEE6" stroke="#888780" stroke-width="1"/>
<polygon points="80,110 140,170 80,170" fill="#EFEEE6" stroke="#888780" stroke-width="1"/>
<polygon points="140,110 200,110 200,170" fill="#EFEEE6" stroke="#888780" stroke-width="1"/>
<polygon points="140,110 200,170 140,170" fill="#EFEEE6" stroke="#888780" stroke-width="1"/>

<circle cx="80" cy="110" r="3.5" fill="#2C2C2A"/>
<circle cx="140" cy="110" r="3.5" fill="#2C2C2A"/>
<circle cx="200" cy="110" r="3.5" fill="#2C2C2A"/>
<circle cx="80" cy="170" r="3.5" fill="#2C2C2A"/>
<circle cx="140" cy="170" r="3.5" fill="#2C2C2A"/>
<circle cx="200" cy="170" r="3.5" fill="#2C2C2A"/>

<text x="140" y="205" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">vertices + faces</text>

<line x1="225" y1="140" x2="395" y2="140" stroke="#5b5b58" stroke-width="1.2" marker-end="url(#arrow2)"/>
<text x="310" y="128" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">triangle edges become graph edges</text>

<text x="480" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#26215C">graph</text>

<line x1="420" y1="110" x2="480" y2="110" stroke="#7F77DD" stroke-width="1.2"/>
<line x1="480" y1="110" x2="480" y2="170" stroke="#7F77DD" stroke-width="1.2"/>
<line x1="480" y1="170" x2="420" y2="110" stroke="#7F77DD" stroke-width="1.2"/>
<line x1="480" y1="170" x2="420" y2="170" stroke="#7F77DD" stroke-width="1.2"/>
<line x1="420" y1="170" x2="420" y2="110" stroke="#7F77DD" stroke-width="1.2"/>
<line x1="480" y1="110" x2="540" y2="110" stroke="#7F77DD" stroke-width="1.2"/>
<line x1="540" y1="110" x2="540" y2="170" stroke="#7F77DD" stroke-width="1.2"/>
<line x1="540" y1="170" x2="480" y2="110" stroke="#7F77DD" stroke-width="1.2"/>
<line x1="540" y1="170" x2="480" y2="170" stroke="#7F77DD" stroke-width="1.2"/>

<circle cx="420" cy="110" r="6" fill="#AFA9EC" stroke="#534AB7" stroke-width="1"/>
<circle cx="480" cy="110" r="6" fill="#AFA9EC" stroke="#534AB7" stroke-width="1"/>
<circle cx="540" cy="110" r="6" fill="#AFA9EC" stroke="#534AB7" stroke-width="1"/>
<circle cx="420" cy="170" r="6" fill="#AFA9EC" stroke="#534AB7" stroke-width="1"/>
<circle cx="480" cy="170" r="6" fill="#AFA9EC" stroke="#534AB7" stroke-width="1"/>
<circle cx="540" cy="170" r="6" fill="#AFA9EC" stroke="#534AB7" stroke-width="1"/>

<text x="480" y="205" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#453F8F">nodes + edges (what the GNN sees)</text>

</svg>
