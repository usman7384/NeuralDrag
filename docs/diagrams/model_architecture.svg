<svg width="680" height="832" viewBox="0 0 680 832" xmlns="http://www.w3.org/2000/svg" role="img">
<title>MeshSurrogate architecture</title>
<desc>Per-vertex input features flow through three FeaStConv graph convolution layers into shared vertex embeddings, which split into a pressure head producing a per-vertex output and a Cd head producing a pooled, whole-shape output.</desc>
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5b5b58" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="190" y="40" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="340" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">input</text>
<text x="340" y="82" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">3586 vertices, 6 features</text>

<line x1="340" y1="96" x2="340" y2="156" stroke="#5b5b58" stroke-width="1.2" marker-end="url(#arrow3)"/>

<rect x="190" y="156" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="340" y="178" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#26215C">featconv layer 1</text>
<text x="340" y="198" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#453F8F">6 to 64 channels, 4 heads</text>

<line x1="340" y1="212" x2="340" y2="272" stroke="#5b5b58" stroke-width="1.2" marker-end="url(#arrow3)"/>

<rect x="190" y="272" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="340" y="294" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#26215C">featconv layer 2</text>
<text x="340" y="314" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#453F8F">64 to 128 channels, 4 heads</text>

<line x1="340" y1="328" x2="340" y2="388" stroke="#5b5b58" stroke-width="1.2" marker-end="url(#arrow3)"/>

<rect x="190" y="388" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="340" y="410" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#26215C">featconv layer 3</text>
<text x="340" y="430" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#453F8F">128 to 256 channels, 4 heads</text>

<line x1="340" y1="444" x2="340" y2="504" stroke="#5b5b58" stroke-width="1.2" marker-end="url(#arrow3)"/>

<rect x="190" y="504" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="340" y="526" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#26215C">shared embeddings</text>
<text x="340" y="546" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#453F8F">3586 by 256, per vertex</text>

<line x1="340" y1="560" x2="230" y2="620" stroke="#5b5b58" stroke-width="1.2" marker-end="url(#arrow3)"/>
<line x1="340" y1="560" x2="490" y2="620" stroke="#5b5b58" stroke-width="1.2" marker-end="url(#arrow3)"/>

<rect x="110" y="620" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="230" y="642" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#04342C">pressure head</text>
<text x="230" y="662" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">per-vertex mlp, 256 to 1</text>

<rect x="370" y="620" width="240" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="490" y="642" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">cd head</text>
<text x="490" y="662" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8A4626">pooled mlp, 512 to 1</text>

<line x1="230" y1="676" x2="230" y2="736" stroke="#5b5b58" stroke-width="1.2" marker-end="url(#arrow3)"/>
<line x1="490" y1="676" x2="490" y2="736" stroke="#5b5b58" stroke-width="1.2" marker-end="url(#arrow3)"/>

<rect x="110" y="736" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="230" y="758" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#04342C">pressure output</text>
<text x="230" y="778" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">3586 per-vertex values</text>

<rect x="370" y="736" width="240" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="490" y="758" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">cd output</text>
<text x="490" y="778" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8A4626">1 value for whole car</text>

</svg>
