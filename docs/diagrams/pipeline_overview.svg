<svg width="680" height="624" viewBox="0 0 680 624" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Project pipeline overview</title>
<desc>Five stages: raw dataset, preprocessing, training the surrogate model, differentiable shape optimization, and verification.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5b5b58" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="60" y="40" width="560" height="64" rx="8" fill="#EEF3FA" stroke="#4C6FA5" stroke-width="1"/>
<text x="340" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#1F3A5F">raw dataset</text>
<text x="340" y="86" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C567F">798 car meshes + pressure fields (Umetani &amp; Bickel)</text>

<line x1="340" y1="104" x2="340" y2="160" stroke="#5b5b58" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="60" y="160" width="560" height="64" rx="8" fill="#EEF3FA" stroke="#4C6FA5" stroke-width="1"/>
<text x="340" y="184" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#1F3A5F">preprocessing</text>
<text x="340" y="206" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C567F">fix the pressure offset, add normals, build the mesh graph</text>

<line x1="340" y1="224" x2="340" y2="280" stroke="#5b5b58" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="60" y="280" width="560" height="64" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="340" y="304" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#26215C">train the surrogate model</text>
<text x="340" y="326" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#453F8F">FeaStConv graph network predicts pressure + drag</text>

<line x1="340" y1="344" x2="340" y2="400" stroke="#5b5b58" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="60" y="400" width="560" height="64" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="340" y="424" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#4A1B0C">differentiable shape optimization</text>
<text x="340" y="446" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8A4626">gradient descent on the mesh's vertex positions</text>

<line x1="340" y1="464" x2="340" y2="520" stroke="#5b5b58" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="60" y="520" width="560" height="64" rx="8" fill="#EEF3FA" stroke="#4C6FA5" stroke-width="1"/>
<text x="340" y="544" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#1F3A5F">verification</text>
<text x="340" y="566" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C567F">cross-check the result against an independent physics signal</text>

</svg>
